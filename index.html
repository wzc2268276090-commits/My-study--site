<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学习笔记本</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>

  <!-- 登录页面 -->
  <div id="loginPage" class="login-container">
    <div class="login-card">
      <h1>学习笔记本</h1>
      <p class="login-subtitle">私人空间，请先登录</p>
      <form id="loginForm">
        <label class="input-label" for="loginEmail">邮箱</label>
        <input type="email" id="loginEmail" placeholder="your@email.com" required>
        <label class="input-label" for="loginPassword">密码</label>
        <input type="password" id="loginPassword" placeholder="输入密码" required>
        <button type="submit" class="btn-primary">登 录</button>
      </form>
      <p id="loginError" class="login-error"></p>
    </div>
  </div>

  <!-- 主应用 -->
  <div id="appPage" class="app-container" style="display:none">
    <header class="topbar">
      <span class="logo">学习笔记本</span>
      <span class="user-area">
        <span id="userEmail"></span>
        <button id="logoutBtn" class="btn-text">登出</button>
      </span>
    </header>
    <div class="app-body">
      <nav class="sidebar">
        <button class="tab-btn active" data-tab="records">每日记录</button>
        <button class="tab-btn" data-tab="errors">错题本</button>
        <button class="tab-btn" data-tab="todos">待办事项</button>
      </nav>
      <main class="content" id="mainContent"></main>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/records.js"></script>
  <script src="js/errors.js"></script>
  <script src="js/todos.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
